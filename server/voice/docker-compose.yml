services:
  deskbot-voice:
    build:
      context: .
      dockerfile: Dockerfile
    image: deskbot-voice-server:latest
    container_name: deskbot-voice
    restart: unless-stopped
    network_mode: "host" # Host networking recommended for low-latency WebSocket & direct LAN device connection
    volumes:
      - ./.env:/app/.env:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
    # When not using host network mode, expose the ports:
    # ports:
    #   - "8000:8000" # WebSocket Voice
    #   - "8003:8003" # OTA Service
    #   - "8004:8004" # Admin API (Local)
    #   - "8006:8006" # Browser Test
    #   - "8010:8010" # Music Gateway

